<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BrandSync — Professional Summary</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --primary: #1a202c; /* Deep Charcoal */
    --accent: #2d3748;
    --success: #276749;
    --border: #cbd5e0;
    --bg: #f7fafc;
    --surface: #ffffff;
    /* Font Stacks */
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-data: "Times New Roman", Times, serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg);
    color: var(--primary);
    font-family: var(--font-ui);
    line-height: 1.6;
  }

  /* --- Header & Layout --- */
  header {
    background: var(--primary);
    color: white;
    padding: 1.5rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid var(--success);
  }

  header h1 { font-size: 1.25rem; letter-spacing: 1px; text-transform: uppercase; }
  
  main {
    max-width: 1100px;
    margin: 2rem auto;
    padding: 0 1rem;
  }

  /* --- Stepper UI --- */
  .stepper {
    display: flex;
    justify-content: center;
    margin-bottom: 3rem;
    gap: 1rem;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    color: #a0aec0;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .step.active { color: var(--primary); }
  .step.done { color: var(--success); }
  .step-num {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid currentColor;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem;
  }

  /* --- Elegant Cards --- */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px; /* Professional sharp corners */
    padding: 2rem;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    margin-bottom: 2rem;
  }

  .card-title {
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    border-left: 4px solid var(--primary);
    padding-left: 1rem;
    text-transform: uppercase;
  }

  /* --- Form Elements --- */
  input[type="text"], select {
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 2px;
    font-size: 1rem;
    width: 100%;
    transition: border-color 0.2s;
  }
  input:focus { outline: none; border-color: var(--success); }

  .btn {
    padding: 0.75rem 1.5rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-radius: 2px;
    border: 1px solid transparent;
    transition: all 0.2s;
    font-family: var(--font-ui);
    font-size: 0.8rem;
  }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #000; }
  .btn-success { background: var(--success); color: white; }
  .btn-outline { border: 1px solid var(--border); background: white; }
  .btn-danger { color: #c53030; border-color: #feb2b2; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* --- Pill Tags --- */
  .pill {
    display: inline-flex;
    align-items: center;
    background: #edf2f7;
    padding: 0.4rem 0.8rem;
    margin: 0.25rem;
    border-radius: 2px;
    font-size: 0.85rem;
    font-weight: 600;
    border: 1px solid var(--border);
  }

  /* --- DATA TABLES (Times New Roman) --- */
  .table-container {
    margin-top: 2rem;
    overflow-x: auto;
  }
  
  .section-divider {
    background: #e2e8f0;
    padding: 0.75rem 1rem;
    font-weight: 800;
    font-size: 0.9rem;
    text-transform: uppercase;
    margin-top: 2rem;
    border: 1px solid var(--border);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    /* Applying your requested font to data */
    font-family: var(--font-data); 
    font-size: 1.1rem;
  }

  th {
    background: #f8fafc;
    font-family: var(--font-ui); /* UI labels stay clean */
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #4a5568;
    padding: 1rem;
    border: 1px solid var(--border);
    text-align: left;
  }

  td {
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
  }

  tr:nth-child(even) { background: #fbfcfe; }

  .num { text-align: right; white-space: nowrap; }
  .grand-total-bar {
    display: flex;
    gap: 2rem;
    background: var(--primary);
    color: white;
    padding: 1.5rem;
    margin-bottom: 1rem;
    font-family: var(--font-data);
    font-size: 1.2rem;
  }

  .upload-box {
    border: 2px dashed var(--border);
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    background: #fff;
    transition: 0.3s;
  }
  .upload-box:hover { border-color: var(--success); background: #f0fff4; }

  #toast {
    position: fixed; bottom: 2rem; right: 2rem;
    background: #2d3748; color: white; padding: 1rem 2rem;
    border-radius: 4px; opacity: 0; transition: 0.3s; pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <h1>BrandSync <span style="font-weight:300; opacity:0.7">| Financial Summary</span></h1>
  <button class="btn btn-danger" style="background:transparent" onclick="clearAll()">Reset System</button>
</header>

<main>
  <div class="stepper">
    <div class="step active" id="step-ind-0"><div class="step-num" id="sc0">1</div> BRANDS</div>
    <div class="step" id="step-ind-1"><div class="step-num" id="sc1">2</div> DATA UPLOAD</div>
    <div class="step" id="step-ind-2"><div class="step-num" id="sc2">3</div> FINAL REPORT</div>
  </div>

  <!-- VIEW 0: BRAND SETUP -->
  <div id="view-0">
    <div class="card">
      <div class="card-title">Setup Brand Entities</div>
      <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
        <input type="text" id="brand-input" placeholder="Enter Brand Name (e.g. Samsung, Apple)" onkeydown="if(event.key==='Enter') addBrand()"/>
        <button class="btn btn-primary" onclick="addBrand()">Add Brand</button>
      </div>
      <div id="pills-area" style="min-height: 50px;"></div>
      <div style="text-align: right; margin-top: 2rem;">
        <button class="btn btn-success" id="confirm-brands-btn" onclick="confirmBrands()" disabled>Continue to Uploads &rarr;</button>
      </div>
    </div>
  </div>

  <!-- VIEW 1: UPLOADS -->
  <div id="view-1" style="display:none">
    <div class="card">
      <div class="card-title">Upload Excel/CSV Sheets</div>
      <div id="brand-upload-list"></div>
      <div style="display: flex; justify-content: space-between; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border);">
        <button class="btn btn-outline" onclick="gotoStep(0)">Back</button>
        <button class="btn btn-success" id="generate-btn" onclick="buildSummary()" disabled>Generate Final Summary</button>
      </div>
    </div>
  </div>

  <!-- VIEW 2: FINAL SUMMARY -->
  <div id="view-2" style="display:none">
    <div class="grand-total-bar" id="summary-stats"></div>
    
    <div style="text-align: right; margin-bottom: 1rem;">
       <button class="btn btn-outline" onclick="gotoStep(1)" style="margin-right: 0.5rem;">Edit Data</button>
       <button class="btn btn-success" onclick="exportExcel()">Export to Excel (.xlsx)</button>
    </div>

    <div id="summary-table-container"></div>
  </div>
</main>

<div id="toast"></div>

<script>
/* --- LOGIC REMAINS THE SAME AS YOUR WORKING VERSION --- */
let brands = [];
let confirmedBrands = [];
let brandData = {};
let colOverride = {};
let summaryData = null;

const $ = id => document.getElementById(id);
const norm = v => String(v ?? '').trim().toUpperCase();
const toAmt = v => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; };
function fmtNum(n) { return n.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

function toast(msg) {
  const el = $('toast');
  el.textContent = msg; el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2500);
}

function autoDetect(keys, patterns) { return keys.find(k => patterns.some(p => p.test(k))) ?? null; }
function detectCols(rows) {
  if (!rows.length) return {};
  const keys = Object.keys(rows[0]);
  return {
    gstCol:  autoDetect(keys, [/gst/i, /gstin/i, /tax.*no/i]),
    amtCol:  autoDetect(keys, [/amount/i, /amt/i, /total/i, /value/i, /qty/i, /sales/i]),
    nameCol: autoDetect(keys, [/name/i, /customer/i, /party/i, /client/i])
  };
}

function gotoStep(s) {
  [0,1,2].forEach(i => {
    $(`view-${i}`).style.display = i === s ? 'block' : 'none';
    const ind = $(`step-ind-${i}`);
    ind.classList.toggle('active', i === s);
    ind.classList.toggle('done', i < s);
    $(`sc${i}`).textContent = i < s ? '✓' : i+1;
  });
}

function addBrand() {
  const v = $('brand-input').value.trim();
  if (!v) return;
  if (brands.includes(v)) { toast('Brand already added'); return; }
  brands.push(v);
  $('brand-input').value = '';
  renderPills();
  $('confirm-brands-btn').disabled = false;
}

function removeBrand(b) {
  brands = brands.filter(x => x !== b);
  renderPills();
  $('confirm-brands-btn').disabled = brands.length === 0;
}

function renderPills() {
  const area = $('pills-area');
  area.innerHTML = brands.length ? '' : '<span style="color:#a0aec0">No brands defined...</span>';
  brands.forEach(b => {
    const span = document.createElement('span');
    span.className = 'pill';
    span.innerHTML = `${b} <span style="cursor:pointer; color:#e53e3e; margin-left:8px" onclick="removeBrand('${b.replace(/'/g,"\\'")}')">×</span>`;
    area.appendChild(span);
  });
}

function confirmBrands() {
  confirmedBrands = [...brands];
  renderBrandUploads();
  gotoStep(1);
}

function renderBrandUploads() {
  const list = $('brand-upload-list');
  list.innerHTML = '';
  confirmedBrands.forEach(brand => {
    const div = document.createElement('div');
    div.style.marginBottom = '1.5rem';
    div.id = `bcard-${brand}`;
    div.innerHTML = buildBrandCard(brand);
    list.appendChild(div);
  });
  checkAllUploaded();
}

function buildBrandCard(brand) {
  const d = brandData[brand];
  const ov = colOverride[brand] ?? {};
  const safeB = brand.replace(/"/g,'&quot;');
  if (!d) {
    return `<div style="font-weight:700; margin-bottom:0.5rem">${brand}</div>
      <div class="upload-box" onclick="this.querySelector('input').click()">
        <input type="file" style="display:none" accept=".xlsx,.xls,.csv" onchange="handleFile(event,'${safeB}')"/>
        <strong>Select Excel File</strong> for ${brand}
      </div>`;
  }
  const cols = Object.keys(d.rows[0] ?? {});
  const opts = (sel) => cols.map(c => `<option value="${c}" ${c===sel?'selected':''}>${c}</option>`).join('');
  return `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem">
      <strong style="color:var(--success)">✓ ${brand} loaded</strong>
      <button class="btn btn-danger" style="padding:4px 8px; font-size:0.7rem" onclick="removeBrandFile('${safeB}')">Remove</button>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1rem; background:#f7fafc; padding:1rem; border:1px solid var(--border)">
      <div><label style="font-size:0.7rem; font-weight:700">NAME COL</label><select onchange="overrideCol('${safeB}','nameCol',this.value)">${opts(ov.nameCol)}</select></div>
      <div><label style="font-size:0.7rem; font-weight:700">GST COL</label><select onchange="overrideCol('${safeB}','gstCol',this.value)">${opts(ov.gstCol)}</select></div>
      <div><label style="font-size:0.7rem; font-weight:700">AMT COL</label><select onchange="overrideCol('${safeB}','amtCol',this.value)">${opts(ov.amtCol)}</select></div>
    </div>`;
}

function handleFile(e, brand) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const wb = XLSX.read(ev.target.result, { type: 'array' });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
    brandData[brand] = { rows, fileName: f.name };
    const det = detectCols(rows);
    colOverride[brand] = { nameCol: det.nameCol||'', gstCol: det.gstCol||'', amtCol: det.amtCol||'' };
    renderBrandUploads();
  };
  reader.readAsArrayBuffer(f);
}

function removeBrandFile(brand) { delete brandData[brand]; delete colOverride[brand]; renderBrandUploads(); }
function overrideCol(brand, key, val) { colOverride[brand][key] = val; }
function checkAllUploaded() { 
  const all = confirmedBrands.length > 0 && confirmedBrands.every(b => brandData[b]); 
  $('generate-btn').disabled = !all; 
}

function buildSummary() {
  const gstMap = {};
  const nonGstList = [];

  for (const brand of confirmedBrands) {
    const d = brandData[brand];
    const ov = colOverride[brand];
    for (const row of d.rows) {
      const gst = norm(row[ov.gstCol]);
      const amt = toAmt(row[ov.amtCol]);
      const name = String(row[ov.nameCol] ?? '').trim();
      if (!gst) {
        nonGstList.push({ name, brand, amt });
      } else {
        if (!gstMap[gst]) gstMap[gst] = { name: '', amounts: {} };
        gstMap[gst].amounts[brand] = (gstMap[gst].amounts[brand] || 0) + amt;
        if (name && !gstMap[gst].name) gstMap[gst].name = name;
      }
    }
  }

  const registeredRows = Object.keys(gstMap).map(gst => {
    let total = 0;
    confirmedBrands.forEach(b => total += (gstMap[gst].amounts[b] || 0));
    return { gst, name: gstMap[gst].name, ...gstMap[gst].amounts, total };
  }).sort((a,b) => b.total - a.total);

  const nonGstGrouped = {};
  nonGstList.forEach(item => {
    const key = item.name || 'UNKNOWN';
    if(!nonGstGrouped[key]) nonGstGrouped[key] = { name: key, gst: 'UNREGISTERED' };
    nonGstGrouped[key][item.brand] = (nonGstGrouped[key][item.brand] || 0) + item.amt;
  });
  
  const unregRows = Object.values(nonGstGrouped).map(r => {
    let total = 0;
    confirmedBrands.forEach(b => total += (r[b] || 0));
    return { ...r, total };
  }).sort((a,b) => b.total - a.total);

  summaryData = { brands: confirmedBrands, registered: registeredRows, unregistered: unregRows };
  renderSummaryTables();
  gotoStep(2);
}

function renderSummaryTables() {
  const { brands: bs, registered: reg, unregistered: unreg } = summaryData;
  const grandTotal = [...reg, ...unreg].reduce((s,r) => s + r.total, 0);
  
  $('summary-stats').innerHTML = `
    <div>TOTAL ENTITIES: <strong>${reg.length + unreg.length}</strong></div>
    <div>GRAND TOTAL: <strong>₹ ${fmtNum(grandTotal)}</strong></div>
  `;

  const createTable = (rows, title) => {
    if (rows.length === 0) return '';
    let html = `<div class="section-divider">${title}</div><div class="table-container"><table><thead><tr>`;
    html += `<th style="width:50px">#</th><th>Customer Name</th><th>GST Identification</th>`;
    bs.forEach(b => html += `<th class="num">${b}</th>`);
    html += `<th class="num">Total Amount</th></tr></thead><tbody>`;
    
    rows.forEach((r, i) => {
      html += `<tr><td>${i+1}</td><td>${r.name || '---'}</td><td style="color:#718096">${r.gst}</td>`;
      bs.forEach(b => html += `<td class="num">${r[b] ? fmtNum(r[b]) : '—'}</td>`);
      html += `<td class="num"><strong>${fmtNum(r.total)}</strong></td></tr>`;
    });
    html += `</tbody></table></div>`;
    return html;
  };

  $('summary-table-container').innerHTML = createTable(reg, "Registered Taxable Entities") + createTable(unreg, "Unregistered / Direct Customers");
}

function exportExcel() {
  const { brands: bs, registered, unregistered } = summaryData;
  const headers = ['Entity Type', 'Customer Name', 'GSTIN', ...bs, 'Total'];
  const data = [
    ...registered.map(r => ['Registered', r.name, r.gst, ...bs.map(b => r[b] || 0), r.total]),
    ['', '', '', ...bs.map(()=>''), ''],
    ...unregistered.map(r => ['Unregistered', r.name, 'N/A', ...bs.map(b => r[b] || 0), r.total])
  ];
  const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Summary');
  XLSX.writeFile(wb, 'Consolidated_Brand_Report.xlsx');
}

function clearAll() { if (confirm('Are you sure you want to clear all data and start a new session?')) location.reload(); }
</script>
</body>
</html>
